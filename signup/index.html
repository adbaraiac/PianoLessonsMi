<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Short, shareable link to the booking form: pianolessonsmi.com/signup
       GitHub Pages has no server-side redirects, so this stub forwards to the
       booking section on the homepage. Deliberately carries no analytics or ad
       pixels - the real page fires those, and a second set here would
       double-count every visit. -->
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.pianolessonsmi.com/" />
  <title>Book your free first piano lesson | Baraiac Piano Lessons</title>
  <script>
    // Preserve utm_source etc so ad traffic is still attributed correctly.
    location.replace('/' + location.search + '#contact');
  </script>
  <!-- Fallback if JavaScript is off. Loses query params, still lands them right. -->
  <noscript><meta http-equiv="refresh" content="0; url=/#contact" /></noscript>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:#faf9f7; color:#2c2c2e; }
    a { color:#3d5c50; font-weight:600; }
  </style>
</head>
<body>
  <p>Taking you to the booking form&hellip; <a href="/#contact">Continue</a></p>
</body>
</html>
