AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Baraiac Piano Lessons - lead intake + email/SMS notification backend

Parameters:
  AidenPhoneNumber:
    Type: String
    Description: "Aiden's phone number in E.164 format, e.g. +12486071916"
    Default: "+12486071916"
  AllowedOrigin:
    Type: String
    Description: "The site origin allowed to call POST /leads"
    Default: "https://porchnotemusic.com"

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        LEADS_TABLE: !Ref PianoLeadsTable
        SLOTS_TABLE: !Ref TeacherSlotsTable
        APPLICATIONS_TABLE: !Ref TeacherApplicationsTable
        APPLICATION_VIDEOS_BUCKET: !Ref ApplicationVideosBucket
        AIDEN_PHONE: !Ref AidenPhoneNumber
        NOTIFICATION_TOPIC_ARN: !Ref LeadNotificationsTopic

Resources:
  LeadNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Baraiac Piano - new lead notifications"

  PianoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
          - "https://www.porchnotemusic.com"
          # Kept while pianolessonsmi.com still 301s here, so a cached copy of
          # the old page can still submit instead of silently failing.
          - "https://pianolessonsmi.com"
          - "https://www.pianolessonsmi.com"
          - "http://localhost:8123"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  TeacherApplicationsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  ApplicationVideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Audition videos of real people. Nothing here is ever public; the review
      # page hands out short-lived signed URLs instead.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Applications go stale, and so does our reason to hold someone's
          # video. Incomplete multipart uploads would otherwise bill forever.
          - Id: ExpireOldApplicationVideos
            Status: Enabled
            ExpirationInDays: 365
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins:
              - !Ref AllowedOrigin
              - "https://www.porchnotemusic.com"
              - "http://localhost:8123"
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

  PianoLeadsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String

  TeacherSlotsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: teacherDay
        Type: String

  SubmitLeadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: submitLead.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PianoLeadsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt LeadNotificationsTopic.TopicName
        - Statement:
            # Direct-to-phone-number SMS publish has no resource ARN to scope
            # to. This is unused until the toll-free number registration is
            # approved, but left in place so SMS activates automatically
            # once it is - no code change needed then.
            - Effect: Allow
              Action: sns:Publish
              Resource: "*"
      Events:
        SubmitLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /leads
            Method: POST

  LeadStatusPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: leadStatusPage.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PianoLeadsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeacherSlotsTable
      Events:
        GetLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /leads/{id}
            Method: GET
        UpdateLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /leads/{id}
            Method: POST

  ApplicationUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: applicationUploadUrl.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ApplicationVideosBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /applications/upload-url
            Method: GET

  SubmitApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: submitApplication.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TeacherApplicationsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt LeadNotificationsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: "*"
      Events:
        SubmitApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /applications
            Method: POST

  ApplicationStatusPageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: applicationStatusPage.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TeacherApplicationsTable
        - S3ReadPolicy:
            BucketName: !Ref ApplicationVideosBucket
      Events:
        GetApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /applications/{id}
            Method: GET
        UpdateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref PianoApi
            Path: /applications/{id}
            Method: POST

Outputs:
  ApiUrl:
    Description: "Base URL for the API - set this as LEADS_API_URL in templatemo-personal-javascripts.js"
    Value: !Sub "https://${PianoApi}.execute-api.${AWS::Region}.amazonaws.com"
  NotificationTopicArn:
    Description: "Subscribe an email to this topic: aws sns subscribe --topic-arn <this> --protocol email --notification-endpoint you@example.com"
    Value: !Ref LeadNotificationsTopic
